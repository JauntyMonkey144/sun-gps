<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Duyệt thành công</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f4f6f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #28a745; }
        .btn-back { background: #007bff; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; display: inline-block; }
        .btn-back:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ status_base }} thành công!</h2>
        <p>Yêu cầu nghỉ phép đã được xử lý lúc {{ now }}</p>
        <a href="{{ url_for('leave_requests') }}" class="btn-back">⬅ Quay lại danh sách</a>
    </div>
</body>
</html>
